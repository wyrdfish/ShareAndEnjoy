<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Replacement Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadReplacementData()">
    <div class="container">
        <h1>Kusto Query Replacement Tool</h1>
        <textarea id="inputString" placeholder="Enter your string here..."></textarea>
        <button onclick="processString()">Replace</button>
        <h2>Output:</h2>
        <textarea id="outputString" readonly></textarea>
        <div id="replacements" class="replacement-list" style="display: none;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
